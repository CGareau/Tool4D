name: Fetch 4D binaries
run-name: "Fetch 4D binaries${{ inputs.branches != '' && format(' · {0}', inputs.branches) || '' }}"

# Pulls 4D Server / Volume Desktop / Mono from the PS FTP runtimes/ factory (tar.xz),
# repacks ZIP assets, and stores them as GitHub Releases so Build_Application can fetch
# via TOOL4D_DOWNLOAD_REPO without product-download.4d.com or a 4D API key.
on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      branches:
        description: 'Branches to process, comma separated (empty = all public versions)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fetch-4d-binaries
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.r.outputs.branches }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false  # keep github.com requests free of the GITHUB_TOKEN header
      - id: r
        env:
          TOOLS_URL: https://x-access-token:${{ secrets.TOOLS_READ_TOKEN }}@github.com/4eDimension/Tools.git
          FORCED: ${{ inputs.branches }}
        run: |
          if [ -n "$FORCED" ]; then
            json="$(tr ',' '\n' <<< "$FORCED" | sed 's/ //g' | grep -E '^[0-9]+(R[0-9]+)?$' | jq -R . | jq -sc .)"
            echo "branches=$json" >> "$GITHUB_OUTPUT"
          else
            ./scripts/resolve-versions.sh
          fi

  fetch:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        branch: ${{ fromJSON(needs.resolve.outputs.branches) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false  # keep github.com requests free of the GITHUB_TOKEN header
      - name: Fetch ${{ matrix.branch }}
        env:
          FTP_PRIVATE_PATH: ${{ secrets.FTP_PRIVATE_PATH }}
          FTP_PRIVATE_LOGIN: ${{ secrets.FTP_PRIVATE_LOGIN }}
          FTP_PRIVATE_PASSWORD: ${{ secrets.FTP_PRIVATE_PASSWORD }}
          FTP_PRIVATE_SSL: ${{ secrets.FTP_PRIVATE_SSL || '1' }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-binaries.sh "${{ matrix.branch }}"
